name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: Ruby ${{ matrix.ruby }} / ActiveSupport ${{ matrix.activesupport }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.1', '3.2', '3.3']
        activesupport: ['6.1', '7.2', '8.0', '8.1']
        exclude:
          # ActiveSupport 8 requires Ruby >= 3.2.
          - ruby: '3.1'
            activesupport: '8.0'
          - ruby: '3.1'
            activesupport: '8.1'
    env:
      # Read by the Gemfile to pin activesupport to this line.
      ACTIVESUPPORT: ${{ matrix.activesupport }}
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rake
